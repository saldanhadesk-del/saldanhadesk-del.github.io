<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitor Saldanha de Souza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Currículo de Vitor Saldanha de Souza — Analista de Sistemas Pleno, especialista TOTVS Protheus nas áreas contábil, fiscal e financeira.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: página clara e centralizada (coluna de 1120px). Cabeçalho fixo com navegação que acompanha
   a rolagem; abertura com foto e ficha rápida; seções interativas (áreas de atuação em abas, projetos
   que abrem, certificações com busca). A folha A4 repete a identidade do currículo original e é o que
   sai na impressão. Tema claro único, por escolha. */
:root {
  color-scheme: light;
  --bg: #F5F7F8;
  --surface: #FFFFFF;
  --ink: #132130;
  --muted: #586874;
  --line: #E0E6E9;
  --accent: #127467;
  --accent-strong: #0D5E53;
  --accent-soft: #E2F1EE;
  --navy: #1B2733;
  --warm: #F0EDE6;

  --sheet-paper: #FFFFFF;
  --sheet-ink: #1A2530;
  --sheet-muted: #5B6B77;
  --sheet-rail: #1F2A36;
  --sheet-rail-ink: #F4F7F8;
  --sheet-rail-muted: #A9BAC5;
  --sheet-accent: #4FC2AE;
  --sheet-accent-ink: #157A6F;
  --sheet-line: #DCE4E7;
  --sheet-stage: #DCE3E6;

  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --wrap: 1120px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.6; margin: 0; }
a { color: inherit; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* ---------- cabeçalho ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
.brand span { font: 600 15px/1.1 var(--font-display); letter-spacing: 0.01em; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; font-size: 13.5px; font-weight: 500; color: var(--muted); padding: 8px 11px; border-radius: 8px; white-space: nowrap; }
.nav a:hover { color: var(--ink); background: var(--bg); }
.nav a[aria-current="true"] { color: var(--accent-strong); background: var(--accent-soft); }
.seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
.seg button { font-size: 12.5px; font-weight: 500; color: var(--muted); background: transparent; border: 0; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); }

/* ---------- abertura ---------- */
.hero { padding-block: 56px 40px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 500 12.5px/1 var(--font-mono); color: var(--accent-strong); background: var(--accent-soft); padding: 7px 11px; border-radius: 999px; }
.eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: block; }
.hero h1 { font: 700 clamp(40px, 6vw, 68px)/0.98 var(--font-display); letter-spacing: -0.015em; margin-top: 18px; }
.hero .tagline { font: 500 clamp(19px, 2.2vw, 23px)/1.35 var(--font-display); margin-top: 18px; max-width: 30ch; }
.hero .tagline em { font-style: normal; color: var(--accent); }
.hero p.intro { color: var(--muted); margin: 14px 0 0; max-width: 60ch; }
.contacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.cbtn { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 14px; color: var(--ink); text-decoration: none; cursor: pointer; }
.cbtn small { font: 500 10.5px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.cbtn:hover { border-color: var(--accent); }
.cbtn .done { color: var(--accent-strong); font-size: 12px; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; padding: 11px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: #FFFFFF; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink); }

.card-id { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 18px 40px -28px rgba(19, 33, 48, 0.35); }
.card-id .ph { position: relative; aspect-ratio: 640 / 709; background: #D7E0E4; max-width: 100%; }
.card-id .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
.badge { position: absolute; left: 14px; bottom: 14px; background: var(--surface); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; line-height: 1.3; box-shadow: 0 6px 20px -8px rgba(19,33,48,.35); }
.badge b { display: block; font: 600 14px/1.2 var(--font-display); }
.ficha { font-family: var(--font-mono); font-size: 12.5px; }
.ficha .cap { display: flex; justify-content: space-between; padding: 10px 16px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); font-size: 11.5px; }
.ficha dl { margin: 0; }
.ficha div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); }
.ficha div:last-child { border-bottom: 0; }
.ficha dt { color: var(--accent-strong); }
.ficha dd { margin: 0; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.stat { padding: 20px 22px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.stat span { display: block; color: var(--muted); font-size: 13.5px; margin-top: 6px; line-height: 1.35; }

/* ---------- seções ---------- */
section.blk { padding-block: 56px; border-top: 1px solid var(--line); }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
.sec-head .k { font: 500 12px/1 var(--font-mono); color: var(--accent-strong); letter-spacing: 0.04em; text-transform: uppercase; }
.sec-head h2 { font: 700 clamp(26px, 3.2vw, 34px)/1.1 var(--font-display); margin-top: 8px; }
.sec-head p { color: var(--muted); max-width: 52ch; margin: 0; font-size: 15px; }

/* áreas de atuação */
.areas { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; }
.tabs { display: flex; flex-direction: column; gap: 6px; }
.tab { text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: transparent; border: 1px solid transparent; border-radius: 12px; padding: 13px 14px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 15px; }
.tab:hover { background: var(--surface); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.tab .arr { color: var(--accent); opacity: 0; }
.tab[aria-selected="true"] .arr { opacity: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 30px; min-height: 100%; }
.panel h3 { font: 700 26px/1.15 var(--font-display); }
.panel .lead { color: var(--muted); margin: 8px 0 18px; font-size: 16px; }
.panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.panel li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.panel li::before { content: ""; width: 9px; height: 9px; margin-top: 8px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.tag { font: 500 12px/1 var(--font-mono); padding: 6px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-strong); }
@media (prefers-reduced-motion: no-preference) {
  .panel.swap { animation: fadeUp .28s ease both; }
  @keyframes fadeUp { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

/* experiência */
.job { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; }
.job + .job { margin-top: 44px; padding-top: 44px; border-top: 1px dashed var(--line); }
.job .meta h3 { font: 700 24px/1.15 var(--font-display); }
.job .meta .org { font-weight: 600; color: var(--accent-strong); margin-top: 4px; }
.job .meta .when { font: 500 13px/1.4 var(--font-mono); color: var(--muted); margin-top: 6px; }
.track { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px; margin-bottom: 22px; }
.track-bar { position: relative; height: 6px; border-radius: 6px; background: var(--line); margin: 14px 6px 12px; }
.track-bar span { position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(90deg, #8FD3C7, var(--accent)); }
.track-bar i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); transform: translate(-50%, -50%); }
.track-labels { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.track-labels div:nth-child(2) { text-align: center; }
.track-labels div:last-child { text-align: right; }
.track-labels b { display: block; font-size: 14px; }
.track-labels span { color: var(--muted); }
.track-title { font: 500 12px/1 var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.groups { display: grid; gap: 22px; }
.group h4 { font: 600 13px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.group ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.group li::marker { color: var(--accent); }

/* projetos */
.projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 10px; }
.proj .ptag { font: 500 11.5px/1 var(--font-mono); color: var(--accent-strong); text-transform: uppercase; letter-spacing: 0.04em; }
.proj h3 { font: 700 21px/1.2 var(--font-display); }
.proj p { margin: 0; color: var(--muted); font-size: 15px; }
.proj .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-wrap: wrap; gap: 6px; }
.stack span { font: 12px/1 var(--font-mono); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.more { background: transparent; border: 0; color: var(--accent-strong); font-weight: 600; font-size: 14px; cursor: pointer; padding: 6px 0; display: inline-flex; gap: 6px; align-items: center; }
.more .chev { display: inline-block; transition: transform .2s; }
.more[aria-expanded="true"] .chev { transform: rotate(180deg); }
.steps { margin: 6px 0 0; padding: 14px 16px; background: var(--bg); border-radius: 12px; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 9px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #FFFFFF; font: 600 12px/22px var(--font-mono); text-align: center; }

/* competências */
.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.skill { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.skill h3 { font: 600 16px/1.2 var(--font-body); margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }

/* certificações */
.cert-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { font-size: 13.5px; font-weight: 500; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
.filters .n { font-family: var(--font-mono); font-size: 11.5px; margin-left: 6px; opacity: 0.75; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-width: 0; flex: 0 1 280px; }
.search input { border: 0; outline: 0; background: transparent; padding: 10px 0; font: inherit; font-size: 14px; color: var(--ink); width: 100%; min-width: 0; }
.search:focus-within { border-color: var(--accent); }
.certs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cert { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; display: flex; flex-direction: column; gap: 3px; }
.cert .t { font-weight: 500; font-size: 14.5px; line-height: 1.35; }
.cert .o { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cert .ok { color: var(--accent-strong); font-weight: 600; }
.cert .live { color: #9A6408; font-weight: 600; }
.empty { color: var(--muted); padding: 16px 0; }

/* formação, idiomas, comportamentais */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.box h3 { font: 600 13px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
.edu + .edu { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.edu b { display: block; }
.edu span { color: var(--muted); font-size: 14px; }
.lang { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.lang + .lang { margin-top: 12px; }
.lang small { color: var(--muted); font-size: 13px; }
.meter { grid-column: 1 / -1; height: 5px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 5px; }

.footer { background: var(--navy); color: #E9EFF2; }
.footer .wrap { padding-block: 44px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center; }
.footer h2 { font: 700 28px/1.15 var(--font-display); }
.footer p { margin: 6px 0 0; color: #A9BAC5; }
.footer .cbtn { background: transparent; color: #FFFFFF; border-color: #3A4B59; }
.footer .cbtn small { color: #A9BAC5; }
.footer .cbtn:hover { border-color: #5CCBB8; }
.footer .cbtn .done { color: #5CCBB8; }

/* ---------- responsivo ---------- */
@media (max-width: 960px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .hero-side { max-width: 520px; }
  .areas { grid-template-columns: minmax(0, 1fr); }
  .tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tab { width: auto; white-space: nowrap; flex: none; }
  .tab[aria-selected="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .tab .arr { display: none; }
  .job { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .trio { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  body { font-size: 15px; }
  .top .wrap { gap: 10px; }
  .brand span { display: none; }
  .hero { padding-block: 32px 28px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .projects, .skills, .certs { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 22px 20px; }
  section.blk { padding-block: 40px; }
  .ficha div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .ficha dt { font-size: 11px; }
}

/* ---------- versão compacta (folha A4) ---------- */
.compact { background: var(--sheet-stage); padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: hidden; }
.compact-note { max-width: 210mm; margin: 0 auto 14px; font-size: 13px; color: var(--ink); display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.compact-note code { font-family: var(--font-mono); font-size: 12px; }
.sheet-holder { margin: 0 auto; width: 210mm; transform-origin: top left; }
.sheet {
  width: 210mm; height: 297mm; background: var(--sheet-paper); color: var(--sheet-ink);
  display: grid; grid-template-columns: 64mm minmax(0, 1fr); overflow: hidden;
  font-family: var(--font-body); font-size: 7.5pt; line-height: 1.34;
  box-shadow: 0 10px 40px rgba(10, 20, 30, 0.25);
}
.s-side { background: var(--sheet-rail); color: var(--sheet-rail-ink); padding: 10mm 6.5mm 8mm 7.5mm; display: flex; flex-direction: column; gap: 4.2mm; }
.s-photo { width: 24mm; height: 24mm; border-radius: 50%; object-fit: cover; display: block; margin-bottom: 3.2mm; box-shadow: 0 0 0 0.6mm var(--sheet-accent); }
.s-name { font: 700 21pt/0.98 var(--font-display); text-transform: uppercase; letter-spacing: -0.005em; }
.s-roles { color: var(--sheet-rail-muted); margin-top: 2.6mm; font-size: 8.3pt; line-height: 1.4; }
.s-h { font: 600 7.6pt/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--sheet-accent); padding-bottom: 1.6mm; border-bottom: 0.3mm solid #34485A; margin-bottom: 2.2mm; }
.s-k { font-size: 6.5pt; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sheet-accent); margin-top: 1.6mm; }
.s-k:first-of-type { margin-top: 0; }
.s-v { word-break: break-word; }
.s-side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.1mm; }
.s-side li { padding-left: 3mm; position: relative; }
.s-side li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 1.2mm; height: 1.2mm; background: var(--sheet-accent); transform: rotate(45deg); }
.s-grp b { display: block; font-weight: 600; font-size: 7.6pt; }
.s-grp span { color: var(--sheet-rail-muted); }
.s-grp + .s-grp { margin-top: 1.1mm; }
.s-soft { color: var(--sheet-rail-muted); }

.s-main { padding: 8.5mm 8.5mm 6.5mm 7.5mm; display: flex; flex-direction: column; gap: 2.9mm; min-width: 0; }
.s-sec h2 { font: 700 10pt/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--sheet-ink); padding-bottom: 1.4mm; border-bottom: 0.45mm solid var(--sheet-accent); margin-bottom: 2.2mm; }
.s-sec p { margin: 0; text-align: justify; hyphens: auto; }
.s-job + .s-job { margin-top: 2.4mm; }
.s-job-h { display: flex; justify-content: space-between; gap: 3mm; align-items: baseline; }
.s-job-h b { font-size: 8.6pt; }
.s-job-h i { color: var(--sheet-muted); font-size: 7.4pt; white-space: nowrap; }
.s-sub { color: var(--sheet-accent-ink); font-size: 7.3pt; margin-top: 0.4mm; }

.compact-note .back { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }

/* ---------- impressão: sai só a folha A4 ---------- */
@page { size: A4; margin: 0; }
@media print {
  :root { padding: 0 !important; }
  html { scroll-behavior: auto; }
  body { background: #fff !important; }
  body::before, .top, .web, .compact-note { display: none !important; }
  .compact, .compact[hidden] { display: block !important; background: #fff !important; padding: 0 !important; overflow: visible; }
  .sheet-holder { width: 210mm !important; transform: none !important; height: auto !important; margin: 0 !important; }
  .sheet { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

function fitSheet() {
  const holder = $("sheet-holder"), box = $("compact");
  if (box.hidden) return;
  holder.style.transform = "none"; holder.style.height = "";
  const s = Math.min(1, (box.clientWidth - 32) / holder.offsetWidth);
  holder.style.transform = s < 1 ? `scale(${s})` : "none";
  holder.style.height = s < 1 ? `${holder.scrollHeight * s}px` : "";
  holder.style.marginLeft = s < 1 ? "0" : "auto";
}

/* ============ modo web / A4 ============ */
let modo = location.hash === "#a4" || location.hash === "#compacto" ? "compacto" : "web";
function aplicarModo() {
  const compacto = modo === "compacto";
  $("web").hidden = compacto; $("compact").hidden = !compacto;
  $("nav").style.visibility = compacto ? "hidden" : "";
  $("btn-web").setAttribute("aria-pressed", String(!compacto));
  $("btn-compacto").setAttribute("aria-pressed", String(compacto));
  if (compacto) requestAnimationFrame(fitSheet);
}
function trocarModo(novo) {
  modo = novo;
  try {
    if (novo === "compacto") { if (location.hash !== "#a4") location.hash = "a4"; }
    else if (location.hash === "#a4" || location.hash === "#compacto") { history.replaceState(null, "", location.pathname + location.search); }
  } catch (_) { /* pré-visualização sem histórico: segue só com o estado da página */ }
  aplicarModo();
  window.scrollTo(0, 0);
}

/* ============ navegação: seção atual e progresso ============ */
function ligarNavegacao() {
  const links = [...document.querySelectorAll(".nav a")];
  const secs = links.map(a => document.querySelector(a.getAttribute("href")));
  const atualizar = () => {
    const y = window.scrollY + 120;
    let atual = -1;
    secs.forEach((s, i) => { if (s && s.offsetTop <= y) atual = i; });
    links.forEach((a, i) => a.setAttribute("aria-current", String(i === atual)));
    const max = document.documentElement.scrollHeight - innerHeight;
    $("progress").style.width = (max > 0 ? Math.min(100, (scrollY / max) * 100) : 0) + "%";
    if (atual >= 0) { const l = links[atual]; const nav = $("nav"); if (l.offsetLeft < nav.scrollLeft || l.offsetLeft + l.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = l.offsetLeft - 12; }
  };
  addEventListener("scroll", atualizar, { passive: true });
  addEventListener("resize", atualizar);
  atualizar();
  links.forEach(a => a.addEventListener("click", e => {
    if (modo !== "web") return;
    const alvo = document.querySelector(a.getAttribute("href"));
    if (alvo) { e.preventDefault(); alvo.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  }));
}

  const n = CV.areas.length;
  const mapa = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
  if (!(e.key in mapa)) return;
  e.preventDefault(); const i = (areaAtual + mapa[e.key] + n) % n; mostrarArea(i); $(`tab-${i}`).focus();
});
document.querySelector(".projects").addEventListener("click", e => {

  const aberto = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!aberto));
  $(b.getAttribute("aria-controls")).hidden = aberto;
  b.firstChild.textContent = aberto ? "Como funciona " : "Fechar ";
});
document.querySelector(".filters").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { certArea = b.dataset.area; renderCerts(); } });
$("busca-cert").addEventListener("input", e => { certBusca = e.target.value; renderCerts(); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const done = b.querySelector(".done");
  const ok = () => { done.textContent = "Copiado"; setTimeout(() => done.textContent = "", 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.querySelector(".v")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done.textContent = "Selecionado"; setTimeout(() => done.textContent = "", 1600); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(ok, fallback); } catch (_) { fallback(); }
});
addEventListener("beforeprint", () => { const h = $("sheet-holder"); h.style.transform = "none"; h.style.height = ""; });
addEventListener("afterprint", fitSheet);
